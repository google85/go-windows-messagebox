name: Create release
run-name: Create release with tag ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Please input version/tag'
        required: false
        default: 'v1.0.'
      push_image:
        description: 'Also push to Docker registry?'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.check.outputs.valid }}
    steps:
      - name: Get the latest tag and bump version [not used]
        id: new-tag
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const response = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const tags = response.data;
            if (tags.length === 0) {
              throw new Error("No tags found in repository");
            }
            let latestTag = tags[0].name;
            console.log(`Latest tag is ${latestTag}`);

            const versionMatch = latestTag.match(/v(\d+)\.(\d+)\.(\d+)/);
            if (!versionMatch) {
              throw new Error(`Latest tag ${latestTag} does not match semantic versioning`);
            }

            const major = versionMatch[1];
            const minor = versionMatch[2];
            const patch = parseInt(versionMatch[3]) + 1;
            const newTag = `v${major}.${minor}.${patch}`;
            console.log(`New tag is ${newTag}`);

            return newTag;

      - name: Validate release tag
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "Checking if version '$VERSION' is a valid release..."
          tag="${{ github.event.inputs.version }}"

          # Get all release tags from GitHub API
          releases=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases)

          tags=$(echo "$releases" | jq -r '.[].tag_name')
          if echo "$tags" | grep -qx "$VERSION"; then
            echo "❌ Release tag already exists!"
            echo "❌ Release tag already exists!" >> $GITHUB_STEP_SUMMARY
            echo "$tags"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "✅ Valid release tag"
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs: validate-tag
    runs-on: ubuntu-latest
    if: ${{ needs.validate-tag.result == 'success' }}
    continue-on-error: false
    env:
      RELEASE_BRANCH_FROM: 'master'
      RELEASE_TAG: ${{ inputs.version }}
      RELEASE_NAME: ${{ inputs.version }}
      RELEASE_BODY: Release ${{ inputs.version }}\r\n - body of the release

    steps:
      - name: Pre-summary
        run: |
          echo '#### Creating release tag: ${{ inputs.version }}' >> $GITHUB_STEP_SUMMARY

      - name: Create tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ env.RELEASE_TAG }}',
              sha: context.sha
            }).catch(err => {
              if (err.status !== 422) throw err;
            })

      - name: Create release tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ env.RELEASE_TAG }}',
              target_commitish: '${{ env.RELEASE_BRANCH_FROM }}',
              name: '${{ env.RELEASE_NAME }}',
              body: '${{ env.RELEASE_BODY }}',
              draft: true,
              prerelease: false
            });

  docker-build-publish:
    name: Build and publish Docker images
    needs: create-release
    runs-on: ubuntu-latest
    continue-on-error: false
    env:
      GO_VERSION: 1.24.3
      DOCKER_BUILDKIT: 1
      DOCKER_REGISTRY_ORG: 'google85'             # vars.DOCKERHUB_USERNAME
      DOCKER_IMAGE_NAME: 'go-windows-messagebox'
      DOCKER_IMAGE_TAG: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check if secrets are available
        run: |
          if [ -z "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "Repository secret is missing: GHCR_TOKEN "
            exit 1
          fi
          if [ -z "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            echo "Repository variable is missing: DOCKERHUB_USERNAME "
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Repository secret is missing: DOCKERHUB_TOKEN "
            exit 1
          fi

      - name: Setup environment
        run: |
          mkdir -p ./bin

          REV_VERSION=`git rev-parse --short=8 HEAD || echo "unknown"`
          DOCKER_FULL_IMAGE=${{ env.DOCKER_REGISTRY_ORG }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
          DOCKER_BIN_IMAGE=${{ env.DOCKER_REGISTRY_ORG }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}-binaries
          echo "DOCKER_FULL_IMAGE=$DOCKER_FULL_IMAGE" >> $GITHUB_ENV
          echo "DOCKER_BIN_IMAGE=$DOCKER_BIN_IMAGE" >> $GITHUB_ENV
          echo "REV_VERSION=$REV_VERSION" >> $GITHUB_ENV

          # get version from main.go file
          BIN_VERSION=$(grep -o 'VERSION = "[^"]*"' cmd/main.go | cut -d'"' -f2)
          echo "#" >> $GITHUB_STEP_SUMMARY
          echo "- cmd/main.go v${BIN_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "HELLO_BIN_VERSION=$BIN_VERSION" >> $GITHUB_ENV

          # cleanup env
          echo "DOCKER_REGISTRY_ORG=" >> $GITHUB_ENV
          echo "DOCKER_IMAGE_NAME="   >> $GITHUB_ENV
          echo "DOCKER_IMAGE_TAG="    >> $GITHUB_ENV

      # This is required for GHA cache!
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # https://github.com/settings/tokens/new?scopes=write:packages
      # - name: Login to GitHub Container Registry
      #   if: ${{ inputs.push_image }}
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.repository_owner }}
      #     password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push_image }}
          load: true
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,scope=${{ github.ref_name }},mode=max
          tags: |
            ${{ env.DOCKER_FULL_IMAGE }}
            ghcr.io/${{ env.DOCKER_FULL_IMAGE }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}

      - name: Build again for binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          target: binary
          outputs: type=local,dest=./bin/releases/
          push: false
          load: false
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,scope=${{ github.ref_name }},mode=max
          tags: |
            ${{ env.DOCKER_BIN_IMAGE }}
            ghcr.io/${{ env.DOCKER_BIN_IMAGE }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}

      - name: Generate SHA256 checksums
        run: |
          # Generate SHA256 checksums
          cd ./bin/releases
          sha256sum * > checksums.txt
          cd ..

          # cleanup env
          echo "DOCKER_BIN_IMAGE=" >> $GITHUB_ENV
          echo "DOCKER_BUILDKIT=" >> $GITHUB_ENV
          echo "GO_VERSION=" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: messagebox-${{ inputs.version }}-windows-x64
          path: |
            ./bin/releases/msgbox_syswin.exe
            ./bin/releases/msgbox_syscall.exe
            ./bin/releases/checksums.txt

      - name: Upload binaries on GitHub Release page
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.version }}
          files: |
            ./bin/releases/msgbox_syswin.exe
            ./bin/releases/msgbox_syscall.exe
            ./bin/releases/checksums.txt

      - name: Summary
        run:  |
          echo "#" >> $GITHUB_STEP_SUMMARY
          docker image ls >> $GITHUB_STEP_SUMMARY
          echo "#### Docker full images:" >> $GITHUB_STEP_SUMMARY
          echo "-  _**${DOCKER_FULL_IMAGE}**_" >> $GITHUB_STEP_SUMMARY
          echo "-  _**ghcr.io/${DOCKER_FULL_IMAGE}**_" >> $GITHUB_STEP_SUMMARY
          echo "#" >> $GITHUB_STEP_SUMMARY
          echo '#### 🧪 Binary was build and attached to this workflow for download.' >> $GITHUB_STEP_SUMMARY
